[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ml-failure-lab"
version = "0.1.0"
description = "Reproducible numerical and semantic ML failures with verified repairs"
requires-python = ">=3.11"
dependencies = ["torch>=2.6,<3", "numpy>=2,<3"]
license = "MIT"

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
failure-lab = "failure_lab.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
